version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: visitor_pass_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: visitor_pass_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/visitor_pass_db
      - JWT_SECRET=supersecretvisitorpasskey12345
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: visitor_pass_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
